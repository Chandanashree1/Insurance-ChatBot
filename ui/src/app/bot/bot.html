<button
  class="launcher"
  (click)="toggleOpen()"
  [class.open]="isOpen"
  aria-label="Toggle policy assistant chat"
>
  <svg *ngIf="!isOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="7" width="16" height="12" rx="3"/>
    <circle cx="9" cy="13" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="15" cy="13" r="1.2" fill="currentColor" stroke="none"/>
    <path d="M9 3.5v3.5M15 3.5v3.5"/>
    <path d="M4 11H2M22 11h-2"/>
  </svg>
  <svg *ngIf="isOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
</button>

<div class="folder" [class.visible]="isOpen">

  <div class="header">
    <div class="header-top">
      <!-- <div class="seal"> -->
        <!-- <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l7 3v6c0 5-3 8.5-7 11-4-2.5-7-6-7-11V5l7-3z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg> -->
      <!-- </div> -->
      <div class="header-text">
        <h1>Insurance Chatbot</h1>
      </div>
    </div>
  </div>

  <div class="messages" #chatContainer>

    <div class="quick-grid">
      <button class="quick-tile" (click)="quickAction('buyPolicy')" [disabled]="isLoading">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="12" rx="2"/>
            <path d="M8 12h4"/>
            <path d="M15 15l1.5 1.5L19 14"/>
          </svg>
        </span>
        <span class="tile-label">Buy Policy</span>
      </button>

      <button class="quick-tile" (click)="quickAction('rop')" [disabled]="isLoading">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
            <path d="M9 8h6M9 12h6M9 16h3"/>
            <path d="M9 2h6v3H9z"/>
          </svg>
        </span>
        <span class="tile-label">ROP Submission</span>
      </button>

      <button class="quick-tile" (click)="quickAction('renew')" [disabled]="isLoading">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4v6h6"/>
            <path d="M4.5 14a8 8 0 1 0 2-8.5L4 10"/>
          </svg>
        </span>
        <span class="tile-label">Renew Your Policy</span>
      </button>

      <button class="quick-tile" (click)="quickAction('complaint')" [disabled]="isLoading">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <path d="M9 9h6M9 12h4"/>
          </svg>
        </span>
        <span class="tile-label">Register a Complaint</span>
      </button>
    </div>

    <div
      class="row"
      *ngFor="let msg of messages"
      [class.user]="msg.sender === 'user'"
      [class.bot]="msg.sender === 'bot'"
    >
      <div class="bubble">{{ msg.text }}</div>
    </div>

    <div class="row bot" *ngIf="isLoading">
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="composer">
    <button class="home-btn" (click)="goHome()" [disabled]="isLoading" aria-label="Start a new chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l9-8 9 8"/>
        <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>
      </svg>
    </button>
    <textarea
      rows="1"
      placeholder="Type here..."
      [(ngModel)]="userMessage"
      (keydown.enter)="$event.preventDefault(); sendMessage()"
    ></textarea>
    <button class="send-btn" (click)="sendMessage()" [disabled]="isLoading" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>
