<button class="launcher" (click)="toggleOpen()" [class.open]="isOpen" aria-label="Toggle policy assistant chat">

  <svg *ngIf="!isOpen" viewBox="70 35 260 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bodyShine2" cx="35%" cy="25%" r="75%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f6e6ee"/>
      </radialGradient>
      <linearGradient id="visorGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#612B4C"/>
        <stop offset="100%" stop-color="#3a1731"/>
      </linearGradient>
      <radialGradient id="eyeGlow2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe9b8"/>
        <stop offset="100%" stop-color="#ffb84f"/>
      </radialGradient>
      <filter id="softGlow2" x="-30%" y="-30%" width="500%" height="600%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <g id="bot2">
      <!-- Gentle float -->
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-9; 0,0" keyTimes="0;0.5;1"
        dur="2.8s" repeatCount="indefinite"/>

      <!-- Antenna stem -->
      <line x1="200" y1="95" x2="200" y2="65" stroke="#dcb9c9" stroke-width="6" stroke-linecap="round"/>
      <!-- Antenna tip, pulses -->
      <circle cx="200" cy="55" r="12" fill="#ffb84f">
        <animate attributeName="r" values="10;15;10" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.6;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>

      <!-- Round chubby body -->
      <ellipse cx="200" cy="330" rx="95" ry="80" fill="url(#bodyShine2)" stroke="#ddb9c9" stroke-width="2"/>
      <!-- Belly panel -->
      <ellipse cx="200" cy="335" rx="45" ry="35" fill="#612B4C" opacity="0.85"/>
      <circle cx="200" cy="335" r="8" fill="#ffe9b8"/>

      <!-- Left arm, little wave sway -->
      <g transform-origin="120 320">
        <animateTransform attributeName="transform" type="rotate"
          values="0 120 320; -12 120 320; 0 120 320"
          keyTimes="0;0.5;1"
          dur="2.4s" repeatCount="indefinite"/>
        <ellipse cx="105" cy="345" rx="24" ry="34" fill="url(#bodyShine2)" stroke="#ddb9c9" stroke-width="2"/>
      </g>

      <!-- Right arm, opposite sway -->
      <g transform-origin="280 320">
        <animateTransform attributeName="transform" type="rotate"
          values="0 280 320; 12 280 320; 0 280 320"
          keyTimes="0;0.5;1"
          dur="2.4s" repeatCount="indefinite"/>
        <ellipse cx="295" cy="345" rx="24" ry="34" fill="url(#bodyShine2)" stroke="#ddb9c9" stroke-width="2"/>
      </g>

      <!-- Round chubby head -->
      <circle cx="200" cy="190" r="105" fill="url(#bodyShine2)" stroke="#ddb9c9" stroke-width="2"/>

      <!-- Ear discs -->
      <circle cx="90" cy="190" r="18" fill="#612B4C"/>
      <circle cx="310" cy="190" r="18" fill="#612B4C"/>

      <!-- Visor -->
      <path d="M115,165 Q115,140 145,140 Q200,135 255,140 Q285,140 285,165 Q285,225 250,240 Q200,255 150,240 Q115,225 115,165 Z" fill="url(#visorGrad2)"/>
      <path d="M130,155 Q200,130 270,155 Q220,155 200,165 Q170,158 130,155 Z" fill="#ffffff" opacity="0.15"/>

      <!-- Eyes, blink -->
      <g id="eyes2" transform-origin="200 190">
        <animateTransform attributeName="transform" type="scale"
          values="1,1; 1,1; 1,0.1; 1,1; 1,1"
          keyTimes="0;0.85;0.9;0.95;1" additive="sum"
          dur="3.5s" repeatCount="indefinite"/>
        <circle cx="168" cy="190" r="14" fill="url(#eyeGlow2)" filter="url(#softGlow2)"/>
        <circle cx="232" cy="190" r="14" fill="url(#eyeGlow2)" filter="url(#softGlow2)"/>
      </g>

      <!-- Cute smile -->
      <path d="M180,220 Q200,232 220,220" fill="none" stroke="#ffe9b8" stroke-width="5" stroke-linecap="round"/>
    </g>
  </svg>

  <svg *ngIf="isOpen" class="close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="18" y1="6" x2="6" y2="18" />
    <line x1="6" y1="6" x2="18" y2="18" />
  </svg>

</button>

<div class="folder" [class.visible]="isOpen" [class.rtl]="selectedLanguage === 'ar'">

  <div class="header">
    <div class="header-top">
      <div class="header-text">
        <h1>{{ translations[selectedLanguage].title }}</h1>
      </div>

      <div class="language-switch">
        <button [class.active]="selectedLanguage === 'en'" (click)="setLanguage('en')">EN</button>
        <button [class.active]="selectedLanguage === 'ar'" (click)="setLanguage('ar')">العربية</button>
      </div>
    </div>
  </div>

  <div class="messages" #chatContainer>

    <!-- Welcome message -->
    <div class="row bot" *ngIf="messages.length > 0">
      <div class="bubble">
        {{ messages[0].text }}
      </div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="quick-grid">

      <button class="quick-tile" (click)="quickAction('buyPolicy')" [disabled]="isLoading">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <path d="M8 12h4" />
            <path d="M15 15l1.5 1.5L19 14" />
          </svg>
        </span>
        <span class="tile-label">{{ translations[selectedLanguage].buyPolicy }}</span>
      </button>

      <button class="quick-tile" (click)="quickAction('rop')" [disabled]="isLoading">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
            <path d="M9 8h6M9 12h6M9 16h3" />
            <path d="M9 2h6v3H9z" />
          </svg>
        </span>
        <span class="tile-label">{{ translations[selectedLanguage].rop }}</span>
      </button>

      <button class="quick-tile" (click)="quickAction('renew')" [disabled]="isLoading">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 4v6h6" />
            <path d="M4.5 14a8 8 0 1 0 2-8.5L4 10" />
          </svg>
        </span>
        <span class="tile-label">{{ translations[selectedLanguage].renew }}</span>
      </button>

      <button class="quick-tile" (click)="quickAction('complaint')" [disabled]="isLoading">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            <path d="M9 9h6M9 12h4" />
          </svg>
        </span>
        <span class="tile-label">{{ translations[selectedLanguage].complaint }}</span>
      </button>

      <button class="quick-tile" (click)="quickAction('chatWithUs')" [disabled]="isLoading">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
        </span>
        <span class="tile-label">{{ translations[selectedLanguage].chat }}</span>
      </button>

    </div>

    <!-- Agent Connect Modal Overlay -->
    <div class="modal-backdrop-overlay" *ngIf="activeForm === 'agentConnect'"
      [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'">
      <div class="agent-form-card">
        <h2 class="modal-title">{{ translations[selectedLanguage].agentTitle }}</h2>
        <p class="modal-subtitle">{{ translations[selectedLanguage].agentSubtitle }}</p>

        <div class="modal-form-body">
          <div class="input-wrap">
            <input type="text" [(ngModel)]="agentForm.name"
              [placeholder]="translations[selectedLanguage].namePlaceholder"
              [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'" required />
          </div>

          <div class="input-wrap">
            <input type="email" [(ngModel)]="agentForm.email"
              [placeholder]="translations[selectedLanguage].emailPlaceholder"
              [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'" required />
          </div>

          <div class="input-wrap phone-input-row">
            <div class="country-prefix-badge">
              <svg class="flag-icon" viewBox="0 0 3 2" width="20">
                <rect width="3" height="2" fill="#008110" />
                <rect width="3" height="1.3333" fill="#FFF" />
                <rect width="3" height="0.6667" fill="#FF9933" />
                <g transform="translate(1.5,1)">
                  <circle r="0.2917" fill="none" stroke="#000080" stroke-width="0.025" />
                  <circle r="0.0521" fill="#000080" />
                  <path d="M0,0 M0,-0.2917 L0,0 M0,0.2917 L0,0 M-0.2917,0 L0,0 M0.2917,0 L0,0" stroke="#000080"
                    stroke-width="0.015" />
                  <circle r="0.25" fill="none" stroke="#000080" stroke-width="0.01" stroke-dasharray="0.015,0.018" />
                </g>
              </svg>
              <span class="prefix-number">+</span>
            </div>
            <input type="tel" [(ngModel)]="agentForm.phone"
              [placeholder]="translations[selectedLanguage].phonePlaceholder"
              [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'" required />
          </div>
        </div>

        <div class="modal-footer-actions">
          <button type="button" class="btn-link-cancel" (click)="cancelAgentForm()" [disabled]="isConnectingToAgent">
            {{ translations[selectedLanguage].cancel }}
          </button>
          <button type="button" class="btn-solid-submit" (click)="submitAgentConnect()"
            [disabled]="isConnectingToAgent">
            {{ translations[selectedLanguage].submit }}
          </button>
        </div>
      </div>
    </div>

    <!-- User/Bot Conversation -->
    <ng-container *ngFor="let msg of messages.slice(1)">
      <div class="row" [class.user]="msg.sender === 'user'" [class.bot]="msg.sender === 'bot'">
        <div class="bubble">
          {{ msg.text }}

          <div class="action-buttons" *ngIf="msg.actions && msg.actions.length">

            <button *ngFor="let action of msg.actions" (click)="onActionClick(action.action)">

              {{ action.label }}

            </button>

          </div>

          <button *ngIf="msg.showLoginButton" class="login-btn" (click)="openLogin()">
            {{ translations[selectedLanguage].loginBtn }}
          </button>
        </div>
      </div>
    </ng-container>

    <!-- Complaint Form -->
    <div class="complaint-form-card" *ngIf="activeForm === 'complaint'">
      <h3 class="complaint-form-title">{{ translations[selectedLanguage].complaintFormTitle }}</h3>

      <div class="form-field">
        <label>{{ translations[selectedLanguage].subject }} <span class="required">*</span></label>
        <input type="text" [(ngModel)]="complaintForm.subject" [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'" />
      </div>

      <div class="form-field">
        <label>{{ translations[selectedLanguage].fullName }} <span class="required">*</span></label>
        <input type="text" [(ngModel)]="complaintForm.fullName" [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'" />
      </div>

      <div class="form-field">
        <label>{{ translations[selectedLanguage].emailId }} <span class="required">*</span></label>
        <input type="email" [(ngModel)]="complaintForm.email" [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'" />
      </div>

      <div class="form-field">
        <label>{{ translations[selectedLanguage].mobileNumber }} <span class="required">*</span></label>
        <input type="tel" [(ngModel)]="complaintForm.mobile" [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'" />
      </div>

      <div class="form-field">
        <label>{{ translations[selectedLanguage].product }} <span class="required">*</span></label>
        <select [(ngModel)]="complaintForm.product">
          <option value="" disabled selected>{{ translations[selectedLanguage].productPlaceholder }}</option>
          <option *ngFor="let p of complaintProducts" [value]="p">{{ p }}</option>
        </select>
      </div>

      <div class="form-field">
        <label>{{ translations[selectedLanguage].complaintMessage }} <span class="required">*</span></label>
        <textarea rows="3" [(ngModel)]="complaintForm.message"
          [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="form-cancel-btn" (click)="cancelComplaintForm()"
          [disabled]="isSubmittingComplaint">
          {{ translations[selectedLanguage].cancel }}
        </button>
        <button type="button" class="form-submit-btn" (click)="submitComplaint()"
          [disabled]="isSubmittingComplaint">
          {{ translations[selectedLanguage].submit }}
        </button>
      </div>
    </div>

    <!-- Login popup -->
    <div class="login-container" *ngIf="showLoginPopup">
      <h2>{{ translations[selectedLanguage].loginHeader }}</h2>
      <input type="email" placeholder="Enter Email" [(ngModel)]="email" /><br />
      <input type="password" placeholder="Enter Password" [(ngModel)]="password" /><br />
      <button (click)="login()">{{ translations[selectedLanguage].loginBtn }}</button>
    </div>

    <!-- Typing indicator -->
    <div class="row bot" *ngIf="isLoading">
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <!-- Composer -->
  <div class="composer" [class.composer-disabled]="activeForm !== null">
    <button class="home-btn" (click)="goHome()" [disabled]="isLoading" aria-label="Start a new chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M3 11l9-8 9 8" />
        <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" />
      </svg>
    </button>

    <textarea rows="1" [placeholder]="translations[selectedLanguage].placeholder" [(ngModel)]="userMessage"
      [dir]="selectedLanguage === 'ar' ? 'rtl' : 'ltr'" [disabled]="activeForm !== null"
      (keydown.enter)="$event.preventDefault(); !activeForm && sendMessage()"></textarea>

    <button class="send-btn" (click)="sendMessage()" [disabled]="isLoading || activeForm !== null"
      aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13" />
        <polygon points="22 2 15 22 11 13 2 9 22 2" />
      </svg>
    </button>
  </div>

</div>
